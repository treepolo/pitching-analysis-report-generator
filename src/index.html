<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: file:; media-src 'self' file:; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>投球分析報告</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./generator-xp7.css" />
    <link rel="stylesheet" href="./annotations.css" />
    <link rel="stylesheet" href="./range-xp7.css" />
  </head>
  <body class="document-app">
    <header class="document-topbar">
      <div class="brand-lockup">
        <p class="eyebrow">投球分析報告</p>
        <span class="brand-name">長篇報告工作室</span>
      </div>
    </header>

    <p id="app-error" class="app-error" role="alert" hidden></p>

    <main class="document-shell">
      <div id="document-command-bar" class="document-command-bar" role="toolbar" aria-label="文件操作">
        <div class="command-group command-project-group">
          <details class="project-control">
            <summary>文件</summary>
            <div id="project-list" class="project-list" role="listbox" aria-label="開啟文件清單"></div>
            <p id="project-empty" class="empty-state">尚無文件。</p>
          </details>
          <button id="new-project" class="button button-secondary" type="button">新增</button>
        </div>

        <div class="command-group command-block-group">
          <label class="compact-control" for="block-section-target">段落
            <select id="block-section-target" disabled></select>
          </label>
          <button id="import-text" class="button button-quiet" type="button" disabled>匯入 .txt / .md</button>
          <button id="import-media" class="button button-quiet" type="button" disabled>匯入媒體</button>
          <button id="add-text-block" class="button button-quiet" type="button" disabled>+ 文字</button>
          <button id="add-editor-single-video" class="button button-quiet" type="button" disabled>+ 影片</button>
          <button id="add-editor-comparison-video" class="button button-quiet" type="button" disabled>+ 雙影片</button>
        </div>

        <div class="command-group command-save-group">
          <span id="save-state" class="save-state">準備就緒</span>
          <button id="save-project" class="button button-primary" type="button" disabled>儲存</button>
        </div>

        <div class="command-group export-command-group">
          <button id="choose-export-directory" class="button button-quiet" type="button" disabled>選擇資料夾</button>
          <label class="compact-control" for="export-kind">匯出
            <select id="export-kind" disabled>
              <option value="folder">資料夾</option>
              <option value="zip">ZIP</option>
            </select>
          </label>
          <button id="export-report" class="button button-secondary" type="button" disabled>匯出</button>
          <button id="export-cancel" class="button button-quiet" type="button" hidden>取消</button>
          <button id="export-retry" class="button button-quiet" type="button" hidden>重試</button>
        </div>
      </div>

      <section id="editor-empty" class="empty-document" aria-live="polite">
        <p class="eyebrow">你的報告</p>
        <h1>從空白頁開始。</h1>
        <p>建立報告後，直接在文字區塊中撰寫，並在需要的位置放入影片卡片。</p>
        <button id="empty-new-project" class="button button-primary" type="button">建立文件</button>
      </section>

      <section id="editor" class="document-editor" hidden>
        <header class="document-header">
          <div>
            <p class="eyebrow">報告文件</p>
            <h1 id="project-title">未命名報告</h1>
            <p id="project-meta" class="document-meta">本機優先文件 · ${formatDate(project.updatedAt)}</p>
          </div>
          <div class="document-header-meta">
            <span id="block-editor-status" class="document-count">0 個區塊</span>
            <span class="status-pill">本機優先</span>
          </div>
        </header>

        <div class="document-status-row">
          <span id="root-path" class="document-root">專案根目錄</span>
          <span id="export-directory-status" class="export-directory-status" role="status">預設使用專案輸出資料夾。</span>
          <span id="export-status" class="export-status" role="status">開啟文件後即可匯出。</span>
        </div>

        <div id="block-canvas" class="document-canvas" aria-live="polite" aria-label="長篇文件區塊"></div>
      </section>
    </main>

    <dialog id="new-project-dialog">
      <form id="new-project-form" method="dialog" class="dialog-card">
        <p class="eyebrow">新增文件</p>
        <h2>建立報告</h2>
        <label for="new-project-name">文件名稱</label>
        <input id="new-project-name" name="displayName" required maxlength="120" placeholder="投球檢視" />
        <div class="dialog-actions">
          <button type="button" data-close-dialog class="button button-quiet">取消</button>
          <button type="submit" class="button button-primary">建立</button>
        </div>
      </form>
    </dialog>

    <dialog id="import-text-dialog">
      <div class="dialog-card">
        <p class="eyebrow">文字匯入</p>
        <h2>檢視匯入文字</h2>
        <p id="import-text-name" class="muted">—</p>
        <pre id="import-text-preview" class="import-preview"></pre>
        <p id="import-text-error" class="app-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="cancel-import-text" type="button" class="button button-quiet">取消</button>
          <button id="confirm-import-text" type="button" class="button button-primary">插入區塊</button>
        </div>
      </div>
    </dialog>

    <div id="rich-text-toolbar" class="rich-text-toolbar" role="toolbar" aria-label="文字格式" hidden>
      <div class="rich-text-toolbar-main" data-rich-text-toolbar-main>
        <button type="button" data-rich-text-action="bold" aria-label="粗體" title="粗體"><strong>B</strong></button>
        <button type="button" data-rich-text-action="italic" aria-label="斜體" title="斜體"><em>I</em></button>
        <button type="button" data-rich-text-action="link" aria-label="超連結" title="超連結">鏈結</button>
      </div>
      <form class="rich-text-link-form" data-rich-text-link-form hidden>
        <label for="rich-text-link-input">網址</label>
        <input id="rich-text-link-input" data-rich-text-link-input type="text" inputmode="url" autocomplete="url" placeholder="輸入網址" />
        <button type="submit" data-rich-text-action="link-confirm">套用</button>
        <button type="button" data-rich-text-action="link-cancel">取消</button>
        <span class="rich-text-link-error" data-rich-text-link-error role="alert" hidden></span>
      </form>
    </div>
    <script src="./annotation-model.js"></script>
    <script src="./report-contract-base.js"></script>
    <script src="./report-contract.js"></script>
    <script src="./rich-text.js"></script>
    <script src="./renderer.js"></script>
    <script src="./renderer-rate-stability.js"></script>
    <script src="./export-directory-memory.js"></script>
    <script src="./annotation-playhead.js"></script>
    <script src="./annotations.js"></script>
    <script src="./annotation-shortcuts.js"></script>
    <script src="./annotation-point-controls.js"></script>
    <script src="./annotation-step-controls.js"></script>
    <script src="./annotation-editor-coordinator.js"></script>
  </body>
</html>
